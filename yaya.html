<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Birthday Envelope</title>
<link href="https://fonts.googleapis.com/css?family=Allan:400,700" rel="stylesheet">

<style>

body,html{
width:100%;
height:100%;
}

body{
margin:0;
background:mistyrose;
perspective:800px;
overflow:hidden;
}

/* ENVELOPE */

.envelope{
z-index:2;
position:absolute;
width:550px;
height:366.6px;
top:50%;
left:50%;
margin-top:-183px;
margin-left:-275px;
transform-style:preserve-3d;
transform-origin:right center;
transition:transform 1s ease;
font-family:"Allan",sans-serif;
color:#1F1F1F;
}

.envelope .front,
.envelope .back{
position:absolute;
width:100%;
height:100%;
background:#fff;
border-radius:5px;
box-shadow:0 0 30px -5px #fbc0b9eb;
}

.front{
backface-visibility:hidden;
cursor:pointer;
display:table;
}

.mail{
text-align:center;
display:table-cell;
vertical-align:middle;
}

.mail p{
font-weight:bold;
margin:0;
}

.mail p:first-child{
font-size:50px;
color:#ff969f;
}

.mail p:last-child{
font-size:30px;
}

.back{
transform:rotateY(180deg) translate3d(0,0,1px);
}

/* LETTER */

.letter{
z-index:1;
position:absolute;
top:5px;
left:10px;
width:530px;
height:346px;
background:#fff;
border-radius:5px;
padding:0 30px;
box-sizing:border-box;
box-shadow:0 1px 100px #fbc0b9eb;
}

.letter p{
font-size:30px;
letter-spacing:2px;
color:#ff969f;
}

.letter p:nth-child(2){
color:black;
}

.letter p:nth-child(3){
color:#f57882;
margin-top:150px;
float:right;
}

/* FLIPS */

.flip{
position:absolute;
width:100%;
height:100%;
overflow:hidden;
}

.flip:before{
content:"";
position:absolute;
background:#fff;
box-shadow:0 0 100px #f5c1bc52;
}

.top-flip:before,
.bottom-flip:before{
width:388px;
height:388px;
}

.top-flip{
z-index:5;
transform-origin:top center;
}

.top-flip:before{
transform-origin:top left;
transform:rotate(-45deg);
}

.bottom-flip{
z-index:4;
}

.bottom-flip:before{
transform-origin:left bottom;
transform:rotate(45deg) translate(-15px,-15px);
}

.left-flip:before,
.right-flip:before{
width:269px;
height:269px;
top:-5px;
}

.left-flip{
z-index:3;
}

.left-flip:before{
transform-origin:top left;
transform:rotate(45deg);
}

.right-flip{
z-index:2;
}

.right-flip:before{
right:0;
transform-origin:top right;
transform:rotate(-45deg);
}

/* ANIMATIONS */

.envelope.new{
animation:new 1s forwards;
}

.envelope.open{
animation:open 3s forwards;
}

.envelope.open .top-flip{
animation:flip-open 1s 1s forwards;
}

.envelope.open .letter{
animation:letter-out 1s 2s forwards;
}

@keyframes new{
0%{
left:0%;
margin-left:-550px;
}
100%{
left:50%;
margin-left:-275px;
}
}

@keyframes open{
0%{
transform:translate3d(0,0,0) rotateY(0);
}
33%{
transform:translate3d(-100%,0,0) rotateY(-180deg);
}
66%{
transform:translate3d(-100%,0,0) rotateY(-180deg);
}
100%{
transform:translate3d(-100%,733px,0) rotateY(-180deg);
}
}

@keyframes flip-open{
0%{
transform:rotateX(0deg);
z-index:5;
}
50%{
transform:rotateX(0deg);
z-index:5;
}
100%{
transform:rotateX(-180deg);
z-index:-1;
}
}

@keyframes letter-out{
0%{
transform:translate3d(0,0,0);
}
100%{
transform:translate3d(0,-733px,0);
}
}

/* CAKE */

.box{
position:relative;
margin-top:40px;
}

.cake{
position:absolute;
left:50%;
transform:translateX(-50%);
width:200px;
height:40px;
background:#6B5344;
border-radius:100%;
box-shadow:
0 4px 0 #6B5344,
0 8px 0 #6B5344,
0 12px 0 #6B5344,
0 16px 0 #6B5344,
0 20px 0 #6B5344,
0 24px 0 #6B5344,
0 28px 0 #6B5344,
0 32px 0 #2fabde,
0 36px 0 #2fabde,
0 40px 0 #F8ECC9,
0 44px 0 #F8ECC9,
0 48px 0 #F8ECC9,
0 52px 0 #F8ECC9,
0 56px 0 #6B5344,
0 60px 0 #6B5344,
0 64px 0 #6B5344,
0 68px 0 #6B5344,
0 72px 0 #6B5344,
0 76px 0 #6B5344,
0 80px 0 #6B5344;
}

.candle{
background:#fff;
border-top-left-radius:40%;
border-top-right-radius:40%;
position:absolute;
bottom:70%;
left:50%;
margin-left:-5px;
width:10px;
height:50px;
}

.fire{
border-radius:100%;
box-shadow:0 0 40px 10px rgba(248,233,209,0.2);
position:absolute;
top:-12px;
left:50%;
margin-left:-3px;
width:7px;
height:20px;
animation:fire 2s infinite;
background:radial-gradient(circle,#fbf33f 0%,#fcb146 100%);
}

@keyframes fire{
0%{
transform:translateY(0) scale(1);
}
50%{
transform:translateY(-20px) scale(0);
}
100%{
transform:translateY(0) scale(1);
}
}

</style>
</head>

<body>

<div class="envelope new">

<div class="front">
<div class="mail">
<p></p>
<p>Click me</p>
</div>
</div>

<div class="back">

<div class="letter">

<p>Selamat Hari Jadi Ya" :D </p>
<p></p>
<p>❤️</p>

<div class="box">
<div class="cake">
<div class="candle">
<div class="fire"></div>
</div>
</div>
</div>

</div>

<div class="flip left-flip"></div>
<div class="flip right-flip"></div>
<div class="flip bottom-flip"></div>
<div class="flip top-flip"></div>

</div>
</div>

<script>

const envelope=document.querySelector(".envelope");

envelope.addEventListener("click",function(){
if(!this.classList.contains("open")){
this.classList.remove("new");
this.classList.add("open");
}
});

</script>

</body>
</html>
